esphome:
  name: t-dongles3
  friendly_name: Bedroom T-DongleS3 USB

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf   

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
- platform: esphome  
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "T-Dongles3 Fallback Hotspot"
    password: !secret wifi_password

bluetooth_proxy:

esp32_ble_tracker:
  scan_parameters:
    active: True # Whether to send scan-request packets to devices to gather more info (like devicename)
    interval: 320ms # suggested 211ms # default 320ms
    window:   300ms # suggested 120ms # default 30ms  

captive_portal:

spi:
  - id: spi_display
    clk_pin: 5
    mosi_pin: 3
    interface: hardware

  - id: spi_led
    clk_pin: 39
    mosi_pin: 40
    interface: software

display:
  - platform: st7735
    spi_id: spi_display
    model: "INITR_MINI160X80"
    reset_pin: 1
    cs_pin: 4
    dc_pin: 2
    rotation: 90
    device_width: 80
    device_height: 160
    col_start: 0
    row_start: 0
    eight_bit_color: false
    invert_colors: true
    use_bgr: true
    update_interval: 0s
    lambda: |-
     it.printf(10, 10, id(font1),Color(255, 0, 0), "Hello sexy boy :)");

font:
  - file: "gfonts://Roboto"
    id: font1
    size: 20

light:
  - platform: spi_led_strip
    spi_id: spi_led
    name: "Light"
    effects:
      - pulse:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Slow Pulse"
          # transition_length: 1s      # defaults to 1s
          update_interval: 2s

sensor:
  # Uptime sensor.
  - platform: uptime
    name: Uptime