esphome:
  name: "tinys3"
  friendly_name: ZZZ - do not use - TinyS3

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
    
    # type: esp-idf
    # version: recommended
    # # Custom sdkconfig options
    # sdkconfig_options:
    #   COMPILER_OPTIMIZATION_SIZE: y
    # # Advanced tweaking options
    # advanced:
    #   ignore_efuse_mac_crc: false

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
- platform: esphome  
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "S3-Test Fallback Hotspot"
    password: !secret wifi_password

bluetooth_proxy:
  

captive_portal:

output:
  - platform: gpio
    pin: 17
    id: light_1
      
switch:
  - platform: output
    name: switch1
    output: light_1
    on_turn_on:
    - output.turn_on: light_1

light:
  - platform: neopixelbus
    num_leds: 1
    variant: ws2811
    name: "Light"
    pin: 18
    effects:
      - pulse:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Slow Pulse"
          # transition_length: 1s      # defaults to 1s
          update_interval: 2s    