substitutions:
  name: "kitchen-display"
  friendly_name: Living Room #WT32-SC01-Plus

packages:
  common_display: !include common-display.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio
    board_build.arduino.memory_type: qio_opi
    board_upload.maximum_ram_size: 327680
    board_upload.maximum_size: 16777216
     
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

api:

bluetooth_proxy:

esp32_ble_tracker:
  scan_parameters:
    active: True # Whether to send scan-request packets to devices to gather more info (like devicename)
    interval: 320ms # suggested 211ms # default 320ms
    window:   300ms # suggested 120ms # default 30ms    

ota:
- platform: esphome

output:
  - platform: gpio
    pin:
      ignore_strapping_warning: true
      number: GPIO45
    id: backlight_output

light:
  - platform: binary
    name: "Back Light"
    output: backlight_output
    id: backlight
    restore_mode: ALWAYS_ON

spi:
  - type: octal
    id: octal_spi
    clk_pin: 47
    data_pins:
      - 9
      - ignore_strapping_warning: true
        number: 46
      - ignore_strapping_warning: true
        number: 3
      - 8
      - 18
      - 17
      - 16
      - 15  

i2c:
  frequency: 400kHz
  sda: 6
  scl: 5

touchscreen:
  - platform: ft63x6
    id: my_touchscreen
    interrupt_pin: 7
    transform:
      swap_xy: true
      mirror_y: true
      mirror_x: false

psram:
  speed: 80MHz
  mode: quad

lvgl:
  rotation: 90

display:
  - platform: mipi_spi
    id: w32_disp
    model: wt32-sc01-plus
    data_rate: 10MHz
    auto_clear_enabled: false
    color_depth: 16
