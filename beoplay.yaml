substitutions:
  device_name: "esp-beoplay"
  friendly_name: "Beoplay"
  task_stack_in_psram: "true"
  # I2S audio pins
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO5
  i2s_dout_pin: GPIO26
  # RGB LED
  rgb_led_pin: GPIO2
  
esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  on_boot:
    - priority: 800
      then:
        - output.turn_on: pa_enable
    - priority: 200
      then:
        - select.set:
            id: dac_output_select
            option: "BOTH" 

esp32:
  board: esp32dev
  framework:
    type: esp-idf



# ─── Wi-Fi ────────────────────────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE


# ─── Logging / API / OTA ──────────────────────────────────────────────────────
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    # key: secret ota_password

psram:
  mode: quad
  speed: 80MHz

output:
  - platform: gpio
    pin: GPIO21
    id: pa_enable

#switch:
#  - platform: gpio
#    pin: GPIO21
#    id: mute_switch
#    name: "AMP Switch"
#    restore_mode: ALWAYS_ON

# Add a select entity to control the DAC output line
select:
  - platform: es8388
    es8388_id: external_dac
    dac_output:
      id: dac_output_select
      name: "DAC Output"

# ─── I²C Bus (for ES8388 control interface) ───────────────────────────────────
# ES8388 found at 0x10 on GPIO18/23 (board-specific pinout)
i2c:
  sda: GPIO18
  scl: GPIO23
  scan: true

# ─── ES8311 Audio DAC ─────────────────────────────────────────────────────────
audio_dac:
  - platform: es8388
    id: external_dac
    address: 0x10          # default I²C address; change to 0x19 if ADDR pin is high
    # bits_per_sample: 16bit
    # sample_rate: 44100
    # use_mclk: true         # use dedicated MCLK pin (GPIO0 on AudioKit)
    # use_microphone: false  # set true if you also want mic input

# ─── I2S Audio Bus ────────────────────────────────────────────────────────────
# AI-Thinker A1S AudioKit v2.2 ES8388 I2S pin mapping:
#   MCLK  → GPIO0
#   BCLK  → GPIO5
#   LRCLK → GPIO25
#   DOUT  → GPIO26  (ESP32 → ES8388 DAC input → line out)
# MCLK must be specified here; sonocotta sendspin-audio.yaml has no substitution for it
i2s_audio:
  i2s_mclk_pin: GPIO0

external_components:
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: dev
    components: [sendspin, audio_http, audio, ring_buffer, i2s_audio, mixer, resampler]


# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esp32-audio-dock
    ref: main
    refresh: 0s
    files:
      - firmware/esphome/packages/sendspin.yaml
      - firmware/esphome/packages/sendspin-audio.yaml
      - firmware/esphome/packages/light.yaml
      - firmware/esphome/packages/sendspin-audio-addon-external-dac.yaml
      - firmware/esphome/packages/monitoring.yaml
      - firmware/esphome/packages/monitoring-wifi.yaml
