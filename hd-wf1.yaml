esphome:
  name: hd-wf1
  friendly_name: HD-WF1

esp32:
  board: esp32-s2-saola-1
  flash_size: 4MB
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Hd-Wf1 Fallback Hotspot"
    password: !secret wifi_password

safe_mode:

captive_portal:

# external_components:
#   - source: github://netmindz/ESPHome-HUB75-MatrixDisplayWrapper@double-buffer
#     refresh: 0s 

i2c:
  sda: 41
  scl: 42

time:
  - platform: pcf8563
    address: 0x51
    id: pcf8563_time
  - platform: homeassistant
    timezone: "Europe/London"
    on_time_sync:
      then:
        pcf8563.write_time:

font:
  # gfonts://family[@weight]
  - file: "gfonts://Roboto"
    id: roboto
    size: 13
  - file: "gfonts://Roboto"
    id: roboto_small
    size: 8

display:
  - platform: hub75_matrix_display
    id: huidu_wf1
    width: 64
    height: 32
    chain_length: 2
    clock_phase: false
    double_buffer: false

    R1_pin: 2
    R2_pin: 4
    G1_pin: 6
    G2_pin: 8
    B1_pin: 3
    B2_pin: 5
    A_pin: 39
    B_pin: 38
    C_pin: 37
    D_pin: 36
    E_pin: 12
    OE_pin: 35
    CLK_pin: 34
    LAT_pin: 33
    lambda: |-
      auto red = Color(255, 0, 0);
      auto blue = Color(0, 0, 255);
      auto rtc = id(pcf8563_time).now();
      it.line(3, 25, 4 + 2 * rtc.second, 25, blue);
      it.rectangle(2, 2, 124, 28, red);
      it.strftime(100, 18, id(roboto_small), "%H:%M", rtc);
      it.print(10, 8, id(roboto), "Hey Sexy Boy :)");

switch:
  - platform: hub75_matrix_display
    matrix_id: huidu_wf1
    restore_mode: ALWAYS_ON
    id: matrix_power
  - platform: gpio
    id: led_run
    pin: 40

# binary_sensor:
#   - platform: gpio
#     id: test_key
#     pin:
#       number: 17
#       inverted: true

number:
  - platform: hub75_matrix_display
    matrix_id: huidu_wf1
    name: "Brightness"