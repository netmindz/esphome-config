substitutions:
  color_light_grey: "0xCCCCCC"
  color_red: "0xFF0000"
  color_light_blue: "0x3EBDD6"
  color_green: "0x1BC156"
  color_dark_grey: "0x202020"
  color_grey: "0x666666"
  color_white: "0xFFFFFF"
  color_black: "0x000000"
  rate_low_threshold: "15"
  rate_high_threshold: "25"

esphome:
  name: esphome-web-438db0
  friendly_name: zzz - Currently Spare - T-Display

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esphome-Web-438Db0"
    password: !secret wifi_password

captive_portal:

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

time:
  - platform: homeassistant
    id: ha_time

sensor:
  - platform: homeassistant
    entity_id: sensor.octopus_energy_electricity_23l3599542_1900029102710_current_rate
    id: current_rate
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_current_rate
            text:
              format: "%.0fp"
              args: [ 'id(current_rate).state * 100' ]
            text_color: !lambda |-
              if (isnan(x)) {
                return lv_color_hex(${color_white});
              }
              float rate_pence = x * 100;
              if (rate_pence < 0) {
                return lv_color_hsv_to_rgb(240, 100, 100);
              } else if (rate_pence <= ${rate_low_threshold}) {
                float ratio = rate_pence / (float)(${rate_low_threshold});
                uint16_t hue = (uint16_t)(120.0f + 120.0f * (1.0f - ratio));
                return lv_color_hsv_to_rgb(hue, 100, 100);
              } else if (rate_pence >= ${rate_high_threshold}) {
                return lv_color_hsv_to_rgb(0, 100, 100);
              } else {
                float ratio = (rate_pence - ${rate_low_threshold}) / (float)(${rate_high_threshold} - ${rate_low_threshold});
                uint16_t hue = (uint16_t)(120.0f * (1.0f - ratio));
                return lv_color_hsv_to_rgb(hue, 100, 100);
              }

  - platform: homeassistant
    entity_id: sensor.octopus_energy_electricity_23l3599542_1900029102710_next_rate
    id: next_rate
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_next_rate
            text:
              format: "%.0fp"
              args: [ 'id(next_rate).state * 100' ]
            text_color: !lambda |-
              if (isnan(x)) {
                return lv_color_hex(${color_light_grey});
              }
              float rate_pence = x * 100;
              if (rate_pence < 0) {
                return lv_color_hsv_to_rgb(240, 100, 100);
              } else if (rate_pence <= ${rate_low_threshold}) {
                float ratio = rate_pence / (float)(${rate_low_threshold});
                uint16_t hue = (uint16_t)(120.0f + 120.0f * (1.0f - ratio));
                return lv_color_hsv_to_rgb(hue, 100, 100);
              } else if (rate_pence >= ${rate_high_threshold}) {
                return lv_color_hsv_to_rgb(0, 100, 100);
              } else {
                float ratio = (rate_pence - ${rate_low_threshold}) / (float)(${rate_high_threshold} - ${rate_low_threshold});
                uint16_t hue = (uint16_t)(120.0f * (1.0f - ratio));
                return lv_color_hsv_to_rgb(hue, 100, 100);
              }


text_sensor:
  - platform: homeassistant
    entity_id: sensor.low_cost_next_time
    id: low_cost_next_time
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_low_cost_next_time
            text:
              format: " %s"
              args: [ 'id(low_cost_next_time).state == "unavailable" ? "n/a" : id(low_cost_next_time).state.c_str()' ]

  - platform: homeassistant
    entity_id: sensor.daytime_low_time
    id: daytime_low_time
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_daytime_low_time
            text:
              format: " %s"
              args: [ 'id(daytime_low_time).state == "unavailable" ? "n/a" : id(daytime_low_time).state.c_str()' ]


display:
  - platform: st7789v
    model: TTGO TDisplay 135x240
    backlight_pin: GPIO4
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO23
    rotation: 270
    auto_clear_enabled: false

font:
  - file: "gfonts://Roboto"
    id: roboto38
    size: 38

  - file: "gfonts://Roboto@700"
    id: roboto38_bold
    size: 38

  - file: "gfonts://Roboto"
    id: roboto22
    size: 22

  - file: "gfonts://Material+Symbols+Outlined"
    id: icons22
    size: 22
    glyphs:
      - "\U0000efc0" # timer 3
      - "\U0000e518" # sun
      - "\U0000e089" # start
      - "\U0000ef5d" # next

  - file: "gfonts://Material+Symbols+Outlined"
    id: icons38
    size: 38
    glyphs:
      - "\U0000efc0" # timer 3
      - "\U0000e518" # sun
      - "\U0000e089" # start
      - "\U0000ef5d" # next

lvgl:
  displays:
  color_depth: 16
  buffer_size: 10%
  log_level: WARN
  pages:
    - id: main_page
      bg_color: ${color_black}
      widgets:
        # ═══════════════════════════════════════
        # ROW 1: Current Rate + Next Rate (y=0)
        # ═══════════════════════════════════════

        # Current rate icon (star)
        - label:
            id: lbl_current_rate_icon
            x: 8
            y: 0
            text_font: icons38
            text_color: ${color_grey}
            text: "\U0000e089"

        # Current rate value (color changes based on value)
        - label:
            id: lbl_current_rate
            x: 48
            y: 0
            text_font: roboto38_bold
            text_color: ${color_white}
            text: "--p"

        # Next rate icon
        - label:
            id: lbl_next_rate_icon
            x: 120
            y: 0
            text_font: icons38
            text_color: ${color_grey}
            text: "\U0000ef5d"

        # Next rate value
        - label:
            id: lbl_next_rate
            x: 160
            y: 0
            text_font: roboto38
            text_color: ${color_light_grey}
            text: "--p"

        # ═══════════════════════════════════════
        # ROW 2: Daytime Low + Low Cost Time (y=48)
        # ═══════════════════════════════════════

        # Daytime low icon (sun)
        - label:
            id: lbl_daytime_icon
            x: 8
            y: 48
            text_font: icons22
            text_color: ${color_light_grey}
            text: "\U0000e518"

        # Daytime low time
        - label:
            id: lbl_daytime_low_time
            x: 28
            y: 48
            text_font: roboto22
            text_color: ${color_light_grey}
            text: ""

        # Low cost icon (timer 3)
        - label:
            id: lbl_low_cost_icon
            x: 112
            y: 48
            text_font: icons22
            text_color: ${color_light_grey}
            text: "\U0000efc0"

        # Low cost next time
        - label:
            id: lbl_low_cost_next_time
            x: 132
            y: 48
            text_font: roboto22
            text_color: ${color_light_grey}
            text: ""
