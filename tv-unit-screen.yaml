substitutions:
  name: "tv-unit-screen"
  friendly_name: TV Unit Screen - WT32-SC01

packages:
  common_display: !include common-display.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esphome-Web-18E338"
    password: !secret wifi_password

# bluetooth_proxy:

esp32_ble_tracker:
   scan_parameters:
    active: True # Whether to send scan-request packets to devices to gather more info (like devicename)
    interval: 320ms # suggested 211ms # default 320ms
    window:   300ms # suggested 120ms # default 30ms  

captive_portal:

psram:

output:
  - platform: gpio
    pin: GPIO23
    id: backlight_output

light:
  - platform: binary
    name: "Back Light"
    output: backlight_output
    id: backlight
    restore_mode: ALWAYS_ON

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

i2c:
  sda: GPIO18
  scl: GPIO19
  frequency: 400kHz

touchscreen:
  - platform: ft63x6
    id: my_touchscreen
    interrupt_pin: GPIO39
    transform:
      swap_xy: true
      mirror_y: true
      mirror_x: false

lvgl:
  buffer_size: 25%
  rotation: 270

display:
  - platform: ili9xxx
    invert_colors: false
    model: ST7796
    cs_pin: GPIO15
    dc_pin: GPIO21
    reset_pin: GPIO22
    # rotation: 270
    id: my_display
    auto_clear_enabled: false
