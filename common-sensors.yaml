sensor:
  - platform: homeassistant
    id: electricity_power
    # Now sourced from inverter load power (house consumption)
    entity_id: sensor.inverter_load_power
    on_value:
      - lvgl.label.update:
          id: power_label
          text: !lambda |-
            static char buf[32];
            if (isnan(x)) {
              snprintf(buf, sizeof(buf), "--");
            } else {
              snprintf(buf, sizeof(buf), "%.0f", x);
            }
            return buf;
      - lvgl.obj.update:
          id: electric_container
          bg_color: !lambda |-
            if ((id(current_rate).state * 100) > 10) {
              if (id(electricity_power).state > 2000) {
                return lv_color_hex(${color_red});
              } else if (id(electricity_power).state > 800) {
                return lv_color_hex(${color_orange});
              }
            } 
            return lv_color_hex(${color_grey_bk});
            
  
  - platform: homeassistant
    id: current_rate
    entity_id: sensor.octopus_energy_electricity_23l3599542_1900029102710_current_rate
    on_value:
      - lvgl.label.update:
          id: current_rate_label
          text: !lambda |-
            static char buf[16];
            if (isnan(x)) {
              snprintf(buf, sizeof(buf), "--p");
            } else {
              snprintf(buf, sizeof(buf), "%.0fp", x * 100);
            }
            return buf;
      - lvgl.obj.update:
          id: now_container
          bg_color: !lambda |-
            if (isnan(x)) {
              return lv_color_hex(${color_dark_grey});
            }
            float rate_pence = x * 100;
            if (rate_pence < 0) {
              return lv_color_hsv_to_rgb(240, 100, 72);
            } else if (rate_pence <= ${rate_low_threshold}) {
              // Interpolate hue from 240 (blue) up to 120 (green) as rate rises toward low threshold
              float ratio = rate_pence / (float)(${rate_low_threshold});
              uint16_t hue = (uint16_t)(120.0f + 120.0f * (1.0f - ratio));
              return lv_color_hsv_to_rgb(hue, 100, 61);
            } else if (rate_pence >= ${rate_high_threshold}) {
              return lv_color_hsv_to_rgb(0, 100, 72);
            } else {
              // Interpolate hue from 120 (green) down to 0 (red) through 60 (yellow)
              float ratio = (rate_pence - ${rate_low_threshold}) / (float)(${rate_high_threshold} - ${rate_low_threshold});
              uint16_t hue = (uint16_t)(120.0f * (1.0f - ratio));
              uint8_t val = (uint8_t)(58.0f + 14.0f * ratio);
              return lv_color_hsv_to_rgb(hue, 100, val);
            }

  - platform: homeassistant
    id: current_rate_min
    entity_id: sensor.octopus_energy_electricity_23l3599542_1900029102710_current_rate
    attribute: "Current day min rate"

  - platform: homeassistant
    id: current_rate_max
    entity_id: sensor.octopus_energy_electricity_23l3599542_1900029102710_current_rate
    attribute: "Current day max rate"

  
